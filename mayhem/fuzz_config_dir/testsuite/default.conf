Catalog {
  Name = MyCatalog
  dbname = "x"
  dbuser = "x"
  dbpassword = "x"
}

Client {
  Name = bareos-fd
  Description = "Client resource of the Director itself."
  Address = localhost
  Password = "x"          # password for FileDaemon
}

Console {
  Name = bareos-mon
  Description = "Restricted console used by tray-monitor to get the status of the director."
  Password = "x"
  CommandACL = status, .status
  JobACL = *all*
}

Director {                            # define myself
  Name = bareos-dir
  QueryFile = "x/query.sql"
  Maximum Concurrent Jobs = 10
  Password = "x"         # Console password
  Messages = Daemon
  Auditing = yes

  # Set to the number of purchased subscription units
  #
  # Subscriptions = 100


  # Enable the Heartbeat if you experience connection losses
  # (eg. because of your router or firewall configuration).
  # Additionally the Heartbeat can be enabled in bareos-sd and bareos-fd.
  #
  # Heartbeat Interval = 1 min

  # remove comment from "Plugin Directory" to load plugins from specified directory.
  # if "Plugin Names" is defined, only the specified plugins will be loaded,
  # otherwise all director plugins (*-dir.so) from the "Plugin Directory".
  #
  # Plugin Directory = "x"
  # Plugin Names = ""
}

FileSet {
  Name = "Catalog"
  Description = "Backup the catalog dump and Bareos configuration files."
  Include {
    Options {
      Signature = XXH128
    }
    File = "x/x.sql" # database dump
    File = "x"                  # configuration
  }
}

FileSet {
  Name = "LinuxAll"
  Description = "Backup all regular filesystems, determined by filesystem type."
  Include {
    Options {
      Signature = XXH128 # calculate checksum per file
      One FS = No        # change into other filesystems
      FS Type = btrfs
      FS Type = ext2     # filesystems of given types will be backed up
      FS Type = ext3     # others will be ignored
      FS Type = ext4
      FS Type = reiserfs
      FS Type = jfs
      FS Type = vfat     # UEFI
      FS Type = xfs
      FS Type = zfs
    }
    File = /
  }
  # Things that usually have to be excluded
  # You have to exclude x
  # on your bareos server
  Exclude {
    File = x
    File = x
    File = /proc
    File = /dev
    File = /sys
    File = /tmp
    File = /var/tmp
    File = /.journal
    File = /.fsck
  }
}

FileSet {
  Name = "SelfTest"
  Description = "fileset just to backup some files for selftest"
  Include {
    Options {
      Signature = XXH128 # calculate checksum per file
    }
    File = "x"
  }
}

FileSet {
  Name = "Windows All Drives"
  Enable VSS = yes
  Include {
    Options {
      Signature = XXH128
      Drive Type = fixed
      IgnoreCase = yes
      WildFile = "[A-Z]:/hiberfil.sys"
      WildFile = "[A-Z]:/pagefile.sys"
      WildFile = "[A-Z]:/swapfile.sys"
      WildDir = "[A-Z]:/RECYCLER"
      WildDir = "[A-Z]:/$RECYCLE.BIN"
      WildDir = "[A-Z]:/System Volume Information"
      Exclude = yes
    }
    File = /
  }
}

Job {
  Name = "backup-bareos-fd"
  JobDefs = "DefaultJob"
  Client = "bareos-fd"
}

Job {
  Name = "BackupCatalog"
  Description = "Backup the catalog database (after the nightly save)"
  JobDefs = "DefaultJob"
  Level = Full
  FileSet="Catalog"
  Schedule = "WeeklyCycleAfterBackup"

  # This creates an ASCII copy of the catalog
  # Arguments to make_catalog_backup are:
  #  make_catalog_backup <catalog-name>
  RunBeforeJob = "x/make_catalog_backup MyCatalog"

  # This deletes the copy of the catalog
  RunAfterJob  = "x/delete_catalog_backup MyCatalog"

  # This sends the bootstrap via mail for disaster recovery.
  # Should be sent to another system, please change recipient accordingly
  Write Bootstrap = "|x/bsmtp -h x -f \"\(Bareos\) \" -s \"Bootstrap for Job %j\" x"
  Priority = 11                   # run after main backup
}

JobDefs {
  Name = "DefaultJob"
  Type = Backup
  Level = Incremental
  Client = bareos-fd
  FileSet = "SelfTest"                     # selftest fileset
  Schedule = "WeeklyCycle"
  Storage = File
  Messages = Standard
  Pool = Incremental
  Priority = 10
  Write Bootstrap = "x/%c.bsr"
  Full Backup Pool = Full                  # write Full Backups into "Full" Pool
  Differential Backup Pool = Differential  # write Diff Backups into "Differential" Pool
  Incremental Backup Pool = Incremental    # write Incr Backups into "Incremental" Pool
}

Job {
  Name = "RestoreFiles"
  Description = "Standard Restore template. Only one such job is needed for all standard Jobs/Clients/Storage ..."
  Type = Restore
  Client = bareos-fd
  FileSet = "LinuxAll"
  Storage = File
  Pool = Incremental
  Messages = Standard
  Where = /tmp/bareos-restores
  Maximum Concurrent Jobs = 10
}

Messages {
  Name = Daemon
  Description = "Message delivery for daemon messages (no job)."
  mailcommand = "x/bsmtp -h x -f \"\(Bareos\) \<%r\>\" -s \"Bareos daemon message\" %r"
  mail = x = all, !skipped, !audit
  console = all, !skipped, !saved, !audit
  append = "x/bareos.log" = all, !skipped, !audit
  append = "x/bareos-audit.log" = audit
}

Messages {
  Name = Standard
  Description = "Reasonable message delivery -- send most everything to email address and to the console."
  operatorcommand = "x/bsmtp -h x -f \"\(Bareos\) \<%r\>\" -s \"Bareos: Intervention needed for %j\" %r"
  mailcommand = "x/bsmtp -h x -f \"\(Bareos\) \<%r\>\" -s \"Bareos: %t %e of %c %l\" %r"
  operator = x = mount
  mail = x = all, !skipped, !saved, !audit
  console = all, !skipped, !saved, !audit
  append = "x/bareos.log" = all, !skipped, !saved, !audit
  catalog = all, !skipped, !saved, !audit
}

Pool {
  Name = Differential
  Pool Type = Backup
  Recycle = yes                       # Bareos can automatically recycle Volumes
  AutoPrune = yes                     # Prune expired volumes
  Volume Retention = 90 days          # How long should the Differential Backups be kept?
  Maximum Volume Bytes = 10G          # Limit Volume size to something reasonable
  Maximum Volumes = 100               # Limit number of Volumes in Pool
  Label Format = "Differential-"      # Volumes will be labeled "Differential-<volume-id>"
}

Pool {
  Name = Full
  Pool Type = Backup
  Recycle = yes                       # Bareos can automatically recycle Volumes
  AutoPrune = yes                     # Prune expired volumes
  Volume Retention = 365 days         # How long should the Full Backups be kept?
  Maximum Volume Bytes = 50G          # Limit Volume size to something reasonable
  Maximum Volumes = 100               # Limit number of Volumes in Pool
  Label Format = "Full-"              # Volumes will be labeled "Full-<volume-id>"
}

Pool {
  Name = Incremental
  Pool Type = Backup
  Recycle = yes                       # Bareos can automatically recycle Volumes
  AutoPrune = yes                     # Prune expired volumes
  Volume Retention = 30 days          # How long should the Incremental Backups be kept?
  Maximum Volume Bytes = 1G           # Limit Volume size to something reasonable
  Maximum Volumes = 100               # Limit number of Volumes in Pool
  Label Format = "Incremental-"       # Volumes will be labeled "Incremental-<volume-id>"
}

Pool {
  Name = Scratch
  Pool Type = Scratch
  Recycle Pool = Scratch
}

Profile {
   Name = operator
   Description = "Profile allowing normal Bareos operations."

   Command ACL = !.bvfs_clear_cache, !.exit, !.sql
   Command ACL = !configure, !create, !delete, !purge, !prune, !sqlquery, !umount, !unmount
   Command ACL = *all*

   Catalog ACL = *all*
   Client ACL = *all*
   FileSet ACL = *all*
   Job ACL = *all*
   Plugin Options ACL = *all*
   Pool ACL = *all*
   Schedule ACL = *all*
   Storage ACL = *all*
   Where ACL = *all*
}

#
# bareos-webui webui-admin profile resource
#
Profile {
  Name = "webui-admin"
  CommandACL = !.bvfs_clear_cache, !.exit, !.sql, !configure, !create, !delete, !purge, !prune, !sqlquery, !umount, !unmount, *all*
  Job ACL = *all*
  Schedule ACL = *all*
  Catalog ACL = *all*
  Pool ACL = *all*
  Storage ACL = *all*
  Client ACL = *all*
  FileSet ACL = *all*
  Where ACL = *all*
  Plugin Options ACL = *all*
}

#
# bareos-webui profile resource: read-only access
#

Profile {
  Name = "webui-readonly"

  # Allow access to the following commands
  CommandACL = .api, .help, use, version, status
  CommandACL = list, llist
  CommandACL = .clients, .jobs, .filesets, .pools, .storages, .defaults, .schedule
  CommandACL = .bvfs_lsdirs, .bvfs_lsfiles, .bvfs_update, .bvfs_get_jobids, .bvfs_versions, .bvfs_restore

  # Allow access to the following job resources
  Job ACL = *all*

  # Allow access to the following schedule resources
  Schedule ACL = *all*

  # Allow access to the following catalog resources
  Catalog ACL = *all*

  # Allow access to the following  pool resources
  Pool ACL = *all*

  # Allow access to the following storage resources
  Storage ACL = *all*

  # Allow access to the following client resources
  Client ACL = *all*

  # Allow access to the following filset resources
  FileSet ACL = *all*

  # Allow access to restore to any filesystem location
  Where ACL = *all*
}

Schedule {
  Name = "WeeklyCycleAfterBackup"
  Description = "This schedule does the catalog. It starts after the WeeklyCycle."
  Run = Full mon-fri at 21:10
}

Schedule {
  Name = "WeeklyCycle"
  Run = Full 1st sat at 21:00
  Run = Differential 2nd-5th sat at 21:00
  Run = Incremental mon-fri at 21:00
}

Storage {
  Name = File
  Address = x                # N.B. Use a fully qualified name here (do not use "localhost" here).
  Password = "x"
  Device = FileStorage
  Media Type = File
  Maximum Concurrent Jobs = 10 # should be high enough to allow the use all configure devices
}

